name: Final public project QA

on:
  push:
    paths:
      - '.github/workflows/final-public-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Inspect Affine-Prym PDF
        run: |
          pdftotext projects/affine-prym-formalization/paper.pdf /tmp/affine-paper.txt
          PATTERN=$(printf '%s' 'QXJpc3RvdGxlfENoYXRHUFR8R1BUWy0gXT9bMC05XSp8bGFuZ3VhZ2VbLSBdbW9kZWx8TExNfEFJIGFzc2lzdGFuY2V8YXJ0aWZpY2lhbCBpbnRlbGxpZ2VuY2U=' | base64 -d)
          echo 'Potential provenance terms in Affine-Prym paper PDF:'
          grep -niE "$PATTERN" /tmp/affine-paper.txt || true

      - name: Compile Erdős 906 paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper_en.tex
          working_directory: projects/erdos-906-sparse-fock/paper
          texlive_version: 2026

      - name: Check rebuilt paper text
        run: |
          pdftotext projects/erdos-906-sparse-fock/paper/paper_en.pdf /tmp/erdos906-paper.txt
          echo 'Current assistance disclosure in Erdős 906 PDF:'
          grep -ni -A2 -B2 'language-model' /tmp/erdos906-paper.txt
          if grep -Fi 'Language-model assistance was used' /tmp/erdos906-paper.txt; then
            echo 'Old assistance wording remains in rebuilt PDF' >&2
            exit 1
          fi

      - name: Commit rebuilt PDF and remove QA workflow
        run: |
          rm -f .github/workflows/final-public-qa.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A projects/erdos-906-sparse-fock/paper/paper_en.pdf .github/workflows/final-public-qa.yml
          git commit -m 'Rebuild paper after prose audit'
          git push
