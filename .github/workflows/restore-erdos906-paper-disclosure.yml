name: Restore Erdős 906 paper disclosure

on:
  push:
    paths:
      - '.github/workflows/restore-erdos906-paper-disclosure.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original source and assistance statement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/erdos-906-sparse-fock/paper/paper_en.tex')
          s = p.read_text(encoding='utf-8')
          old = r'''\subsection*{Source and assistance statement}
          An earlier note contains the exponential construction
          $\sum_{k\geq1}\exp(-10k^2+k^{3/2}z)$; a later note introduced the sparse construction for $p>4/3$. I have kept the present paper focused on the sparse family and its endpoint. AI-assisted tools were used during exploration, proof checking, and manuscript preparation. The mathematical claims rest on the arguments given here; no external peer review or complete formal verification of the entire paper is claimed.'''.replace('\n          ', '\n')
          new = r'''\subsection*{Source and assistance statement}
          An earlier supplied note contains the exponential construction
          $\sum_{k\geq1}\exp(-10k^2+k^{3/2}z)$; a second supplied note proposes the sparse construction for $p>4/3$. The present arguments develop that sparse construction and its endpoint. Language-model assistance was used in the derivations and manuscript preparation. No external peer review or machine verification of this manuscript is asserted.'''.replace('\n          ', '\n')
          if s.count(old) != 1:
              raise SystemExit(f'expected one current statement, found {s.count(old)}')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Compile paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper_en.tex
          working_directory: projects/erdos-906-sparse-fock/paper
          texlive_version: 2026
      - name: Verify text
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          pdftotext projects/erdos-906-sparse-fock/paper/paper_en.pdf /tmp/paper.txt
          grep -Fq 'Language-model assistance was used in the derivations and manuscript preparation.' /tmp/paper.txt
          ! grep -Fq 'AI-assisted tools were used during exploration, proof checking, and manuscript preparation.' /tmp/paper.txt
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/restore-erdos906-paper-disclosure.yml
          git add projects/erdos-906-sparse-fock/paper/paper_en.tex projects/erdos-906-sparse-fock/paper/paper_en.pdf
          git commit -m 'Restore original Erdős 906 paper disclosure'
          git pull --rebase origin main
          git push
