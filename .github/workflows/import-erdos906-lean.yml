name: Import Erdős 906 Lean source

on:
  push:
    paths:
      - '.github/erdos906-staging/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Reconstruct public source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .github/erdos906-staging/part*.b64 > /tmp/erdos906_round4_source.b64
          base64 -d /tmp/erdos906_round4_source.b64 > /tmp/erdos906_round4_public_source.tar.gz
          echo '89177dd6434e4bef39ee3bb34a1358cdc181f997591925eb4e7fb8455a4da8d0  /tmp/erdos906_round4_public_source.tar.gz' | sha256sum -c -

      - name: Extract Lean project
        shell: bash
        run: |
          set -euo pipefail
          dest='projects/erdos-906-sparse-fock/formalization/lean'
          rm -rf "$dest"
          mkdir -p "$dest"
          tar -xzf /tmp/erdos906_round4_public_source.tar.gz -C "$dest"
          test -f "$dest/RequestProject/Main.lean"
          test -f "$dest/lakefile.toml"
          test -f "$dest/lean-toolchain"
          count=$(find "$dest/RequestProject" -type f -name '*.lean' | wc -l)
          lines=$(find "$dest/RequestProject" -type f -name '*.lean' -print0 | xargs -0 cat | wc -l)
          test "$count" -eq 35
          test "$lines" -eq 6727
          if grep -RInE '(^|[^A-Za-z])(sorry|admit|unsafe|axiom)([^A-Za-z]|$)|native_decide|implemented_by' "$dest/RequestProject"; then
            echo 'Forbidden proof escape found' >&2
            exit 1
          fi

      - name: Commit Lean source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projects/erdos-906-sparse-fock/formalization/lean
          git rm -r .github/erdos906-staging
          git rm .github/workflows/import-erdos906-lean.yml
          git commit -m 'Publish Erdős 906 Lean formalization (Round 4)'
          git push
