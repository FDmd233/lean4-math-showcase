name: Build Erdős 906 paper

on:
  push:
    paths:
      - 'projects/erdos-906-sparse-fock/paper/paper_en.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper_en.tex
          working_directory: projects/erdos-906-sparse-fock/paper
          texlive_version: 2026

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/erdos-906-sparse-fock/paper/paper_en.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
            exit 0
          fi
          git commit -m "Build Erdős 906 paper PDF"
          git push
