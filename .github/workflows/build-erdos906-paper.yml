name: Build Erdős 906 paper

on:
  push:
    paths:
      - 'projects/erdos-906-sparse-fock/paper/paper_en.tex'
      - '.github/workflows/build-erdos906-paper.yml'
  pull_request:
    paths:
      - 'projects/erdos-906-sparse-fock/paper/paper_en.tex'
      - '.github/workflows/build-erdos906-paper.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile paper
        uses: xu-cheng/latex-action@v4
        with:
          root_file: paper_en.tex
          working_directory: projects/erdos-906-sparse-fock/paper
          texlive_version: 2026

      - name: Audit LaTeX log
        shell: bash
        run: |
          set -euo pipefail
          log='projects/erdos-906-sparse-fock/paper/paper_en.log'
          pdf='projects/erdos-906-sparse-fock/paper/paper_en.pdf'
          test -s "$log"
          test -s "$pdf"
          if grep -n -E 'LaTeX Warning:.*undefined|Citation .* undefined|Reference .* undefined|There were undefined references|multiply defined|Overfull \\hbox|! LaTeX Error' "$log"; then
            echo 'Publication-blocking LaTeX diagnostic found.'
            exit 1
          fi

      - name: Commit compiled PDF
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/erdos-906-sparse-fock/paper/paper_en.pdf
          if git diff --cached --quiet; then
            echo "PDF unchanged"
            exit 0
          fi
          git commit -m "Build Erdős 906 paper PDF"
          # The branch may have advanced while LaTeX was compiling. Rebase the
          # generated-PDF commit before pushing so documentation/Lean commits do
          # not make this job fail with a non-fast-forward error.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
