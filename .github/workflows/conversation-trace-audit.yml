name: Conversation trace audit

on:
  push:
    paths:
      - '.github/workflows/conversation-trace-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audit tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ripgrep poppler-utils
      - name: Scan repository text and PDFs
        shell: bash
        run: |
          set +e
          PATTERN='OpenAI|ChatGPT|GPT[- ]?[0-9]|Claude|Astra|Aristotle|language[- ]model|large language model|\bLLM\b|AI assistance|artificial intelligence|\bundergraduate\b|\bthesis\b|\bdefense\b|本科|毕业论文|答辩|public version|public directory|private version|internal version|our conversation|this conversation|chat history|\bprompt\b|run-by-run|tool run|materiali[sz]ation|first pass|guided GPT|produced with Astra'
          echo '=== TEXT MATCHES ==='
          rg -n -i -P --hidden --glob '!*.pdf' --glob '!*.zip' --glob '!*.png' --glob '!*.jpg' --glob '!*.jpeg' --glob '!*.btf' --glob '!conversation-trace-audit.yml' "$PATTERN" . || true
          echo '=== PDF AUDIT ==='
          while IFS= read -r -d '' f; do
            echo "--- $f ---"
            pdfinfo "$f" 2>/dev/null | rg -i '^(Title|Author|Subject|Keywords|Creator|Producer):' || true
            pdftotext "$f" - 2>/dev/null | rg -n -i -P "$PATTERN" || true
          done < <(find . -type f -name '*.pdf' -print0)
